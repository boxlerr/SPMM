name: Keep Alive

on:
  # Cron DESACTIVADO (ago 2026). Esto existía para Render, cuyo free tier dormía
  # el servicio tras 15 min sin tráfico. Cloud Run no se duerme: escala a cero, y
  # escalar a cero es justamente lo que mantiene el costo dentro de la capa gratis.
  # Pinguear cada 10 min mantenía una instancia viva 24/7 pagando CPU+RAM al pedo.
  # schedule:
  #   - cron: '*/10 * * * *'
  workflow_dispatch: # Queda solo el disparo manual

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          URL="${{ secrets.KEEPALIVE_URL || 'https://YOUR_RENDER_URL/health' }}"
          echo "Pinging $URL..."
          
          # Intentar hasta 3 veces (intento inicial + 2 reintentos)
          for i in {1..3}; do
            if curl -fsS "$URL"; then
              echo "Success!"
              exit 0
            fi
            echo "Attempt $i failed. Web server might be down or waking up."
            if [ $i -lt 3 ]; then
              echo "Retrying in 5 seconds..."
              sleep 5
            fi
          done
          
          echo "Failed after 3 attempts."
          exit 1
